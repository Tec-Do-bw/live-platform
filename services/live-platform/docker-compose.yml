# live-platform Phase 1 部署编排
# 依据：docs/designs/2026-05-10-mediamtx-deployment-adr.md
# network_mode: host 消除 NAT/bridge 开销，localhost 即宿主机
# bind mount 绕过 overlay2，直达宿主机文件系统

services:
  mediamtx:
    image: bluenviron/mediamtx:1.9.3-ffmpeg
    container_name: live-platform-mediamtx
    network_mode: "host"
    restart: unless-stopped
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
      - /data/recordings:/data/recordings
    # 健康探针：调用 mediamtx 自身 API（host 网络，用 127.0.0.1:9997）
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9997/v3/paths/list"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "15"
          memory: 8G

  live-platform:
    build:
      context: .
      dockerfile: Dockerfile
    image: live-platform:local
    container_name: live-platform
    network_mode: "host"
    restart: unless-stopped
    depends_on:
      mediamtx:
        condition: service_healthy  # P2-6: 依赖 mediamtx 健康后再启动
    # 健康探针：与 Dockerfile HEALTHCHECK 一致
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - /data/recordings:/data/recordings
      - /data/live-platform/logs:/app/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
