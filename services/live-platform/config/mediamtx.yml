# MediaMTX Phase 1 配置骨架
# 依据：docs/designs/2026-05-07-live-platform-phase1-mediamtx.md（§5）
#       docs/designs/2026-05-10-mediamtx-deployment-adr.md（§5.3）
# network_mode: host，API/Metrics 绑定 127.0.0.1 避免对外暴露

api: yes
apiAddress: 127.0.0.1:9997

metrics: yes
metricsAddress: 127.0.0.1:9998

# 80 路并发建议值，防 write queue full
writeQueueSize: 2048
readTimeout: 30s
writeTimeout: 30s

pathDefaults:
  record: yes
  recordFormat: fmp4
  recordPartDuration: 1s
  # 切片回调是状态机健康信号的来源，切片时长须 < 健康检查超时 30s
  recordSegmentDuration: 10s
  recordPath: /data/recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  runOnRecordSegmentComplete: >
    curl -X POST http://127.0.0.1:8080/internal/segment-ready
    -H "Content-Type: application/json"
    -d '{"path":"$MTX_PATH","filePath":"$MTX_SEGMENT_PATH","duration":"$MTX_SEGMENT_DURATION"}'

paths:
  all_others:
